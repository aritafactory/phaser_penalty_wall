      <stop offset="0" stop-color="#11171d"/>
      <stop offset="1" stop-color="#080c10"/>
    </linearGradient>
    <radialGradient id="red"><stop stop-color="#e1251c" stop-opacity=".32"/><stop offset="1" stop-color="#e1251c" stop-opacity="0"/></radialGradient>
