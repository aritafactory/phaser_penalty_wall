<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Color Block Breaker</title>
    <style>
      :root {
        color-scheme: dark;
        --panel: rgba(18, 23, 30, 0.9);
        --panel-border: rgba(174, 184, 199, 0.28);
        --green: #19b447;
      }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: #0b0f14; color: #e2e8f0; min-height: 100vh; }
      body.start-active { overflow: hidden; }
      .start-screen { position: fixed; inset: 0; z-index: 50; min-height: 100vh; overflow: hidden; background:
          radial-gradient(circle at 17% 19%, rgba(225, 37, 28, .18), transparent 12%),
          radial-gradient(circle at 12% 39%, rgba(0, 132, 255, .16), transparent 14%),
          radial-gradient(circle at 14% 64%, rgba(255, 211, 0, .16), transparent 13%),
          radial-gradient(circle at 83% 22%, rgba(16, 181, 67, .18), transparent 13%),
          radial-gradient(circle at 91% 44%, rgba(148, 45, 207, .18), transparent 12%),
          radial-gradient(circle at 86% 68%, rgba(244, 119, 0, .16), transparent 12%),
          linear-gradient(180deg, #11171d 0%, #080c10 100%); display: flex; align-items: center; justify-content: center; padding: 28px; transition: opacity .25s ease, visibility .25s ease; }
      .start-screen[hidden] { display: none; }
      .start-screen::before { content: ''; position: absolute; inset: -60px; opacity: .22; background-image: linear-gradient(rgba(255,255,255,.06) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.06) 1px, transparent 1px); background-size: 52px 52px; mask-image: radial-gradient(circle at center, transparent 0 18%, #000 58%, transparent 88%); }
      .start-top { position: absolute; top: clamp(18px, 4vw, 42px); left: clamp(20px, 4vw, 48px); right: clamp(20px, 4vw, 48px); display: flex; justify-content: space-between; align-items: center; z-index: 2; }
      .icon-btn, .currency-pill, .plus-btn { border: 2px solid var(--panel-border); box-shadow: inset 0 0 0 2px rgba(255,255,255,.04), 0 10px 24px rgba(0,0,0,.45); background: linear-gradient(180deg, rgba(38,44,52,.92), rgba(8,11,15,.94)); color: white; }
      .icon-btn { width: 88px; height: 88px; border-radius: 14px; font-size: 44px; display: grid; place-items: center; text-shadow: 0 2px 3px #000; cursor: pointer; }
      .currency-pill { min-width: 260px; height: 88px; border-radius: 14px; display: flex; align-items: center; justify-content: center; gap: 14px; padding: 0 16px 0 20px; font-size: 34px; font-weight: 800; }
      .gem { width: 46px; height: 46px; display: inline-grid; place-items: center; filter: drop-shadow(0 5px 6px rgba(0,0,0,.45)); }
      .plus-btn { width: 54px; height: 54px; border-radius: 10px; font-size: 44px; line-height: 1; cursor: pointer; }
      .start-content { position: relative; z-index: 1; width: min(690px, 92vw); display: flex; flex-direction: column; align-items: center; margin-top: 38px; }
      .logo { text-align: center; filter: drop-shadow(0 14px 12px rgba(0,0,0,.65)); }
      .logo-line { display: block; font-weight: 900; letter-spacing: .02em; line-height: .9; text-transform: uppercase; }
      .logo-color { font-size: clamp(72px, 8vw, 132px); }
      .logo-color span:nth-child(1) { color:#ff382e; } .logo-color span:nth-child(2) { color:#158cff; } .logo-color span:nth-child(3) { color:#06c45d; } .logo-color span:nth-child(4) { color:#ffd117; } .logo-color span:nth-child(5) { color:#ff8a00; }
      .logo-block { font-size: clamp(78px, 8.8vw, 148px); color: #f2f2f2; text-shadow: 0 4px 0 #777, 0 10px 16px #000; }
      .logo-breaker { margin-top: 22px; font-size: clamp(36px, 4.5vw, 70px); letter-spacing: .32em; color: #595d64; text-shadow: 0 2px 2px rgba(255,255,255,.3), 0 7px 10px #000; }
      .divider { width: 100%; height: 2px; margin: 26px 0 28px; background: linear-gradient(90deg, transparent, rgba(255,255,255,.35), transparent); }
      .swatches { display:flex; gap: 28px; margin-bottom: 46px; }
      .swatch { width: 32px; height: 32px; border-radius: 5px; box-shadow: inset 0 2px 2px rgba(255,255,255,.34), inset 0 -4px 4px rgba(0,0,0,.25), 0 5px 8px rgba(0,0,0,.55); }
      .start-actions { width: min(620px, 100%); display: grid; gap: 26px; }
      .menu-btn { height: 104px; border-radius: 15px; border: 2px solid rgba(255,255,255,.16); color: #fff; font-weight: 900; font-size: clamp(36px, 4vw, 54px); letter-spacing: .04em; text-shadow: 0 3px 4px #000; box-shadow: inset 0 2px 0 rgba(255,255,255,.24), inset 0 -5px 0 rgba(0,0,0,.25), 0 12px 24px rgba(0,0,0,.55); cursor: pointer; }
      .play-btn { background: linear-gradient(180deg, #23cb50, #0b8d31); border-color: #39e763; }
      .shop-start-btn { background: linear-gradient(180deg, #252b32, #0d1117); }
      .floating-block { position:absolute; width: 120px; height: 120px; border-radius: 14px; transform: rotate(var(--rot)); background: var(--color); box-shadow: inset 0 4px 9px rgba(255,255,255,.22), inset 0 -7px 8px rgba(0,0,0,.28), 0 14px 22px rgba(0,0,0,.65), 0 0 38px var(--glow); }
      .b1{--rot:20deg;--color:#d92721;--glow:rgba(217,39,33,.45);left:14%;top:13%}.b2{--rot:18deg;--color:#0872c9;--glow:rgba(8,114,201,.45);left:5%;top:34%}.b3{--rot:-12deg;--color:#e4b900;--glow:rgba(228,185,0,.45);left:11%;top:56%}.b4{--rot:20deg;--color:#555;--glow:rgba(255,255,255,.12);left:7%;bottom:7%}.b5{--rot:-15deg;--color:#07913a;--glow:rgba(7,145,58,.45);right:16%;top:18%}.b6{--rot:-15deg;--color:#76209b;--glow:rgba(118,32,155,.45);right:6%;top:38%}.b7{--rot:16deg;--color:#df7000;--glow:rgba(223,112,0,.45);right:10%;top:61%}.b8{--rot:-15deg;--color:#4a4a4a;--glow:rgba(255,255,255,.12);right:8%;bottom:7%}
      .app { max-width: 980px; margin: 0 auto; padding: 16px; }
      .controls { display:flex; gap: 12px; align-items:center; flex-wrap: wrap; margin-bottom: 12px; }
      select, button { padding: 8px 10px; border-radius: 8px; border: 1px solid #334155; background:#1e293b; color:#e2e8f0; }
      #game { border: 1px solid #334155; border-radius: 10px; overflow: hidden; }
      .status { display:flex; gap: 12px; flex-wrap: wrap; }
      .badge { background:#1e293b; border:1px solid #334155; padding: 6px 10px; border-radius: 999px; }
      .sub { color: #94a3b8; margin: 0 0 12px; }
      .modal-backdrop { position: fixed; inset: 0; background: rgba(2,6,23,.75); display: none; align-items: center; justify-content: center; z-index: 100; }
      .modal-backdrop.open { display: flex; }
      .modal { width: min(920px, 94vw); max-height: 86vh; overflow: auto; background: #0b122a; border: 1px solid #334155; border-radius: 12px; padding: 16px; }
      .modal h2 { margin-top: 0; }
      .shop-table { width: 100%; border-collapse: collapse; }
      .shop-table th, .shop-table td { border: 1px solid #334155; padding: 8px; vertical-align: top; }
      .shop-table th { background: #1e293b; }
      .play-layout { display: flex; gap: 12px; align-items: stretch; }
      .inventory { width: 300px; min-width: 260px; border: 1px solid #334155; border-radius: 10px; padding: 10px; background: #07153b; }
      .inventory h3 { margin-top: 0; margin-bottom: 10px; }
      .inventory ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
      .inventory li { border: 1px solid #334155; border-radius: 8px; padding: 6px 8px; background: #102044; display:flex; justify-content:space-between; }
      @media (max-width: 900px) { .floating-block { width: 72px; height: 72px; } .icon-btn, .currency-pill { height: 58px; } .icon-btn { width:58px; font-size:30px; } .currency-pill { min-width:168px; font-size:24px; } .gem { width:32px; height:32px; } .plus-btn { width:38px; height:38px; font-size:30px; } .swatches { gap:14px; } .swatch { width:22px; height:22px; } .menu-btn { height:78px; } }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
  </head>
  <body class="start-active">
    <section id="startScreen" class="start-screen" aria-label="Start screen">
      <div class="start-top">
        <button class="icon-btn" type="button" aria-label="Settings">⚙</button>
        <div class="currency-pill" aria-label="Total score"><span class="gem">💎</span><span id="startBalanceLabel">0</span><button class="plus-btn" id="startPlusBtn" type="button" aria-label="Open shop">+</button></div>
      </div>
      <div class="floating-block b1"></div><div class="floating-block b2"></div><div class="floating-block b3"></div><div class="floating-block b4"></div>
      <div class="floating-block b5"></div><div class="floating-block b6"></div><div class="floating-block b7"></div><div class="floating-block b8"></div>
      <div class="start-content">
        <h1 class="logo" aria-label="Color Block Breaker">
          <span class="logo-line logo-color"><span>C</span><span>O</span><span>L</span><span>O</span><span>R</span></span>
          <span class="logo-line logo-block">BLOCK</span>
          <span class="logo-line logo-breaker">BREAKER</span>
        </h1>
        <div class="divider"></div>
        <div class="swatches" aria-hidden="true">
          <span class="swatch" style="background:#ef342e"></span><span class="swatch" style="background:#f18300"></span><span class="swatch" style="background:#f0c500"></span><span class="swatch" style="background:#00b94e"></span><span class="swatch" style="background:#0789d7"></span><span class="swatch" style="background:#8425aa"></span><span class="swatch" style="background:#696969"></span>
        </div>
        <div class="start-actions">
          <button id="startPlayBtn" class="menu-btn play-btn" type="button">▶ &nbsp; PLAY</button>
          <button id="startShopBtn" class="menu-btn shop-start-btn" type="button">🛒 &nbsp; SHOP</button>
        </div>
      </div>
    </section>
    <div class="app">
      <h1>Color Block Breaker (Phaser)</h1>
      <div class="controls">
        <label>Level:
          <select id="levelSelect"></select>
        </label>
        <button id="startBtn">Start Level</button>
        <button id="shopBtn">Shop</button>
      </div>
      <div class="status">
        <div class="badge" id="scoreLabel">Level Score: 0</div>
        <div class="badge" id="totalScoreLabel">Total Score: 0</div>
        <div class="badge" id="shotsLabel">Shots: ∞</div>
        <div class="badge" id="timerLabel">Timer: ∞</div>
        <div class="badge" id="stateLabel">Status: Game in Progress</div>
      </div>
      <div class="play-layout">
        <div id="game"></div>
        <aside class="inventory">
          <h3>Boosters</h3>
          <ul id="boosterInventoryList"></ul>
        </aside>
      </div>
    </div>

    <div id="shopModal" class="modal-backdrop" aria-hidden="true">
      <div class="modal">
        <div class="controls" style="justify-content:space-between">
          <h2>Shop</h2>
          <button id="closeShopBtn">Close</button>
        </div>
        <div class="badge" id="shopBalanceLabel">Balance: 0</div>
        <table class="shop-table">
          <thead>
            <tr><th>Booster</th><th>Price</th><th>Effect</th><th>Buy</th></tr>
          </thead>
          <tbody id="shopTableBody"></tbody>
        </table>
      </div>
    </div>
    <script type="module" src="game.js?v=2"></script>
  </body>
</html>
